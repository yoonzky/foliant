<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f9"/>
      <stop offset="1" stop-color="#cdd3ee"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#97a3f7"/>
      <stop offset="1" stop-color="#6b78e2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".45"/>
    </linearGradient>
    <clipPath id="front">
      <rect x="128" y="132" width="212" height="272" rx="34"/>
    </clipPath>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1b2160" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="182" y="110" width="212" height="272" rx="34" fill="url(#back)" transform="rotate(9 288 246)"/>
  <g filter="url(#shadow)">
    <rect x="128" y="132" width="212" height="272" rx="34" fill="#e4e8f7"/>
  </g>
  <g clip-path="url(#front)">
    <rect x="128" y="132" width="212" height="272" fill="url(#bg)"/>
    <rect x="182" y="110" width="212" height="272" rx="34" fill="url(#back)" transform="rotate(9 288 246)" filter="url(#frost)"/>
    <rect x="128" y="132" width="212" height="272" fill="url(#glass)"/>
  </g>
  <rect x="130" y="134" width="208" height="268" rx="32" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g stroke="#5a66d8" stroke-opacity=".6" stroke-width="13" stroke-linecap="round">
    <path d="M172 206H296M172 254H296M172 302H254"/>
  </g>
